name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Resolve release tag
        id: release
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check tag matches Cargo version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Strip binary
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/naskah"
          if [[ "${{ matrix.target }}" == *-apple-darwin ]]; then
            strip -x "$binary"
          else
            strip "$binary"
          fi

      - name: Ad-hoc sign macOS binary
        if: contains(matrix.target, 'apple-darwin')
        run: |
          codesign --force --sign - "target/${{ matrix.target }}/release/naskah"
          codesign --verify --verbose=2 "target/${{ matrix.target }}/release/naskah"

      - name: Package
        id: package
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="naskah-v${version}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/naskah" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish release and update tap
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-tap-update
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release tag
        id: release
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag \
              --title "Naskah ${TAG}" \
              --generate-notes
          fi

      - name: Check tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Missing TAP_GITHUB_TOKEN secret; cannot update iman1704/homebrew-tap."
            exit 1
          fi

      - name: Check out tap
        uses: actions/checkout@v7
        with:
          repository: iman1704/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/render-homebrew-formula.sh "${TAG#v}" dist/SHA256SUMS > tap/Formula/naskah.rb

      - name: Commit and push tap update
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/naskah.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "naskah ${TAG#v}"
          git push
