[package]
name = "naskah"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A TUI markdown note browser"
license = "MIT"
repository = "https://github.com/iman1704/naskah"
homepage = "https://github.com/iman1704/naskah"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
image = "0.25.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-cmark-mdcat = { version = "2.19", default-features = false, features = ["ratatui"] }
resvg = { version = "0.43", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = "3.5.1"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
